{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{- if .Refresh}}
<meta http-equiv="refresh" content="5">
{{- end}}
<title>{{.Title}} · solpay-shop{{if .Admin}} admin{{end}}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body{{if .Wide}} class="wide"{{end}}>
<header class="site"><a class="brand" href="/">solpay-shop</a> <span class="tag">devnet</span>
{{- if .Admin}}
<nav class="admin" aria-label="Admin">
{{- range .Nav}}
<a href="{{.Href}}"{{with .Current}} aria-current="{{.}}"{{end}}>{{.Text}}</a>
{{- end}}
</nav>
{{- end}}</header>
<main>
{{template "content" .Data}}
</main>
<footer class="site">Digital downloads paid in SOL on Solana devnet. No real money is involved.</footer>
</body>
</html>
{{end}}

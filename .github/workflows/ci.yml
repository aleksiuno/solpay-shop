name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet -tags=integration ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: go test (race, integration)
        run: go test -race -tags=integration -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: docker build
        run: docker build --build-arg VERSION="$GITHUB_SHA" -t solpay-shop:ci .
      - name: compose config
        run: docker compose config --quiet
        env: # placeholders: compose only checks that the required values are set
          POSTGRES_PASSWORD: ci
          MERCHANT_ADDRESS: ci
          ADMIN_USER: ci
          ADMIN_PASS: ci
          DOWNLOAD_SECRET: ci
